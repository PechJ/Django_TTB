{% extends "base.html" %}

{% block title %}FRT-Import{% endblock %}

{% block content %}

<section class="welcome">

```
<h2>FRT-Import</h2>

<p>
    FRT-Anträge und Freigaben aus den Excel-Dateien importieren.
</p>
```

</section>

<section class="import-section">

```
<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Datei importieren
    </button>

</form>
```

</section>

{% endblock %}
