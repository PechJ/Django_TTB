{% extends "base.html" %}

{% block content %}

<h1>Funk-Stammdaten importieren</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Importieren
    </button>

</form>

{% if result %}

<h2>Import abgeschlossen</h2>

<ul>
    <li>Neu: {{ result.created }}</li>
    <li>Aktualisiert: {{ result.updated }}</li>
    <li>Übersprungen: {{ result.skipped }}</li>
</ul>

{% endif %}

{% endblock %}
